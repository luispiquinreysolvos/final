name: slv-ai

services:
  db:
    container_name: slv-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    container_name: slv-odoo
    build:
      context: .
      dockerfile: docker/odoo/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./oca/helpdesk:/mnt/oca/helpdesk:ro
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/database/selector')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-model-puller:
    container_name: slv-ollama-model-puller
    image: curlimages/curl:latest
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - 'until curl -sf http://ollama:11434/api/tags; do sleep 2; done; curl -fsS http://ollama:11434/api/pull -H "Content-Type: application/json" -d "{\"model\":\"qwen3.5:2b\",\"stream\":false}"'
    restart: "no"

  ollama:
    container_name: slv-ollama
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:11434:11434"
    volumes:
      - ./models:/models
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-}
    networks:
      - default

  ai-api:
    container_name: slv-ai-api
    ports:
      - "${AI_API_BIND_IP:-127.0.0.1}:8000:8000"
    build:
      context: ./services/tickets_ai
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.1}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-2048}
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-7}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - ollama-model-puller
    networks:
      - default

volumes:
  postgres_data:
  odoo_data:
